apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-api
  namespace: aether
spec:
  replicas: 2
  selector:
    matchLabels: { app: aether-api }
  template:
    metadata:
      labels: { app: aether-api }
    spec:
      containers:
        - name: api
          image: aether-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: aether-config }
            - secretRef: { name: aether-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: aether-api
  namespace: aether
spec:
  selector: { app: aether-api }
  ports:
    - port: 8000
      targetPort: 8000
