apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aether
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: aether
            - name: POSTGRES_DB
              value: aether
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: aether-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aether
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
