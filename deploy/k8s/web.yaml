apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-web
  namespace: aether
spec:
  replicas: 2
  selector:
    matchLabels: { app: aether-web }
  template:
    metadata:
      labels: { app: aether-web }
    spec:
      containers:
        - name: web
          image: aether-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aether-web
  namespace: aether
spec:
  type: LoadBalancer
  selector: { app: aether-web }
  ports:
    - port: 80
      targetPort: 80
